apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  namespace: default
spec:
  replicas: 4
  strategy:
    canary:
      analysis:
        templates:
        - templateName: error-rate
        startingStep: 1
        args:
        - name: service-name
          value: demo-app
      steps:
      - setWeight: 20
      - pause: {duration: 25s}
      - setWeight: 50
      - pause: {duration: 25s}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo-app
        image: demo-app:v2.0.0-buggy
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "v3.0.0 (Risky Release - Buggy & Unstable)"
        - name: COLOR_THEME
          value: "#ef4444" # Red Theme
        - name: SIMULATE_FAILURE
          value: "true" # BUG ACTIVE! This will cause Prometheus to trigger automatic rollback!
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
